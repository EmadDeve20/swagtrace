[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "swagtrace"
version = "0.0.5"
description = "Lightweight API recorder and automated test runner for Swagger/OpenAPI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "yaml-syntax>=0.0.9",
    "httpx2>=2.12.0",
    "prompt_toolkit>=3.0.53",
    "readchar==4.2.2",
]


[project.scripts]
swagtrace = "swagtrace.cli:main"
