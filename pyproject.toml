[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "swagtrace"
version = "0.1.0"
description = "Lightweight API recorder and automated test runner for Swagger/OpenAPI"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "yaml-syntax>=0.0.9",
    "httpx>=0.28.1",
    "fastapi>=0.141.1",
]


[project.scripts]
swagtrace = "swagtrace.cli:main"
